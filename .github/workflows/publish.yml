name: Publish to npm

on:
  push:
    branches: [develop]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "website/**"
      - ".github/**"
      - "!.github/workflows/publish.yml"

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run build
      - run: npm test

      - name: Bump patch version
        id: bump
        run: |
          OLD_VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          node -e "
            const fs = require('fs');
            const path = require('path');

            function updateJson(file, fn) {
              const p = JSON.parse(fs.readFileSync(file, 'utf8'));
              fn(p);
              fs.writeFileSync(file, JSON.stringify(p, null, 2) + '\n');
            }

            // 1. packages/mcp/package.json
            updateJson('packages/mcp/package.json', p => {
              p.version = '${NEW_VERSION}';
              p.dependencies['@ruby_sakura/agentmemory'] = '~${NEW_VERSION}';
            });

            // 2. plugin JSONs
            for (const f of ['plugin/.claude-plugin/plugin.json', 'plugin/.codex-plugin/plugin.json', 'plugin/plugin.json']) {
              updateJson(f, p => { p.version = '${NEW_VERSION}'; });
            }

            // 3. src/version.ts
            const vts = fs.readFileSync('src/version.ts', 'utf8');
            fs.writeFileSync('src/version.ts', vts.replace(/\"${OLD_VERSION}\"/, '\"${NEW_VERSION}\"'));

            // 4. src/types.ts — append new version to ExportData union
            let types = fs.readFileSync('src/types.ts', 'utf8');
            types = types.replace(
              /\"${OLD_VERSION}\";/,
              '\"${OLD_VERSION}\" | \"${NEW_VERSION}\";'
            );
            fs.writeFileSync('src/types.ts', types);

            // 5. src/functions/export-import.ts — add to supportedVersions
            let ei = fs.readFileSync('src/functions/export-import.ts', 'utf8');
            ei = ei.replace(
              /\"${OLD_VERSION}\"\]/,
              '\"${OLD_VERSION}\", \"${NEW_VERSION}\"]'
            );
            fs.writeFileSync('src/functions/export-import.ts', ei);

            // 6. test/export-import.test.ts — update version assertion
            let test = fs.readFileSync('test/export-import.test.ts', 'utf8');
            test = test.replace(
              new RegExp('toBe\\\\(\"${OLD_VERSION}\"\\\\)'),
              'toBe(\"${NEW_VERSION}\")'
            );
            fs.writeFileSync('test/export-import.test.ts', test);
          "
          git add package.json packages/mcp/package.json \
            plugin/.claude-plugin/plugin.json plugin/.codex-plugin/plugin.json plugin/plugin.json \
            src/version.ts src/types.ts src/functions/export-import.ts test/export-import.test.ts
          git commit -m "chore: bump version ${OLD_VERSION} -> ${NEW_VERSION} [skip ci]"
          git tag "v${NEW_VERSION}"
          git push origin develop --tags
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish @ruby_sakura/agentmemory
        run: |
          if npm view "@ruby_sakura/agentmemory@${{ steps.bump.outputs.version }}" version >/dev/null 2>&1; then
            echo "Version ${{ steps.bump.outputs.version }} already published, skipping"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @ruby_sakura/mcp
        working-directory: packages/mcp
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@ruby_sakura/mcp@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION already published, skipping"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @ruby_sakura/fs-watcher
        working-directory: integrations/filesystem-watcher
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@ruby_sakura/fs-watcher@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION already published, skipping"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
