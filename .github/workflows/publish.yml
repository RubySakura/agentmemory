name: Publish to npm

on:
  push:
    branches: [develop]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "website/**"
      - ".github/**"
      - "!.github/workflows/publish.yml"

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run build
      - run: npm test

      - name: Bump patch version
        id: bump
        run: |
          OLD_VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          # Sync mcp shim version with main package
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('packages/mcp/package.json', 'utf8'));
            p.version = '${NEW_VERSION}';
            p.dependencies['@ruby_sakura/agentmemory'] = '~${NEW_VERSION}';
            fs.writeFileSync('packages/mcp/package.json', JSON.stringify(p, null, 2) + '\n');
          "
          git add package.json packages/mcp/package.json
          git commit -m "chore: bump version ${OLD_VERSION} -> ${NEW_VERSION} [skip ci]"
          git tag "v${NEW_VERSION}"
          git push origin develop --tags
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish @ruby_sakura/agentmemory
        run: |
          if npm view "@ruby_sakura/agentmemory@${{ steps.bump.outputs.version }}" version >/dev/null 2>&1; then
            echo "Version ${{ steps.bump.outputs.version }} already published, skipping"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @ruby_sakura/mcp
        working-directory: packages/mcp
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@ruby_sakura/mcp@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION already published, skipping"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @ruby_sakura/fs-watcher
        working-directory: integrations/filesystem-watcher
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@ruby_sakura/fs-watcher@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION already published, skipping"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
