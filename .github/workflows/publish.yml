name: Publish to npm

on:
  push:
    branches: [develop]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "website/**"
      - ".github/**"
      - "!.github/workflows/publish.yml"

# Skip concurrent publishes — if two pushes land close together,
# only the latest one runs.
concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run build
      - run: npm test

      - name: Bump patch version
        id: bump
        run: |
          OLD_VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          git add package.json
          git commit -m "chore: bump version ${OLD_VERSION} -> ${NEW_VERSION} [skip ci]"
          git tag "v${NEW_VERSION}"
          git push origin develop --tags
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish @ruby_sakura/agentmemory
        run: |
          if npm view "@ruby_sakura/agentmemory@${{ steps.bump.outputs.version }}" version >/dev/null 2>&1; then
            echo "Version ${{ steps.bump.outputs.version }} already published, skipping"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
